name: Reset auf funktionierenden Stand

on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Auf funktionierenden Commit zurücksetzen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git read-tree --reset -u 3f0e49cef3ff6979bdfecdc6ea20ab4865fbbb6e^{tree}

          git add -A
          git commit -m "Projektstand auf funktionierenden Stand 3f0e49c zurückgesetzt" || exit 0
          git push origin HEAD:main
