name: Projekt auf alten Stand zurücksetzen

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Alten Stand als neuen Projektstand übernehmen
        run: |
          git config user.name "BinesKreativWerk"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git read-tree --reset -u 3f0e49c300f4079dcceb72b9c96d3b1f9116fa7^{tree}
          git add -A
          git commit -m "Projektstand auf 3f0e49c zurückgesetzt"
          git push origin HEAD:main
